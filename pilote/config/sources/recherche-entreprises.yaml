# Déclaration d'une source (fiche 01). Les CHOIX de l'utilisateur sont dans reglages.yaml, jamais ici.
id: recherche-entreprises
nom: Annuaire des entreprises (France)
description: Sociétés déclarées au registre français (SIRENE) avec leur siège et leurs
  établissements. Gratuit, sans clé. Sert aussi à vérifier qu'un nom existe.
trouve: sociétés, avec siège et établissements
genres:
- entreprise
- administration
pays:
- FR
produit:
- nom
- origine
- ville
- numero
- fonction
- relations
- alias
usages:
- entreprises
cle: ''
cout:
  unite: appel
  vers_dollar: 0
  par_appel: 1
  gratuit_par_mois: 0
confiance: 0.9
defaut:
  chercher: true
  verifier: false  # A6 (spec 912) : la source SAIT vérifier par le nom depuis le 15/11/2026 ; éteinte par défaut tant que le test réel n'est pas fait (QUESTIONS.md Q-A6), à cocher dans Réglages
exemple_reponse: exemples/recherche-entreprises.json
moteur:
  adaptateur: recherche_entreprises
  parametres:
    correspondance_exacte: true  # A6 (spec 912) : en vérification, seul le nom exactement rendu compte
    filtre: entreprise
    etablissements: 3
main: premiere
origine: registre
famille: api
roles:
- chercher
- verifier
- enrichir
mode:
  en_ligne: true
  local: false
verifie_le: '2026-10-13'
consomme:
- sujet
- pays
# A6 (spec 912) : ce registre de première main vérifie chaque nom trouvé (nom exact, puis contrôle A2 : un autre champ doit concorder).
verifie_sur: nom
