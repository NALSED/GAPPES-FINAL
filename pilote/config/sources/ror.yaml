# Déclaration d'une source (fiche 01). Les CHOIX de l'utilisateur sont dans reglages.yaml, jamais ici.
id: ror
nom: ROR (organisations de recherche)
description: Registre mondial des universités, instituts de recherche et hôpitaux
  universitaires. Données libres (CC0), interrogeables par nom et par pays.
trouve: universités, instituts de recherche, hôpitaux universitaires
genres:
- administration
pays:
- monde
usages:
- organisations
famille: api
confiance: 0.9
consomme:
- sujet
- pays
produit:
- nom
- origine
- ville
- site
- numero
- alias
main: premiere
origine: registre
roles:
- chercher
- verifier
- enrichir
cle: ''
cout:
  unite: appel
  vers_dollar: 0
  par_appel: 1
  gratuit_par_mois: 0
mode:
  en_ligne: true
  local: false
verifie_le: '2026-10-13'
defaut:
  chercher: true
  verifier: false  # A6 (spec 912) : la source SAIT vérifier par le nom depuis le 15/11/2026 ; éteinte par défaut tant que le test réel n'est pas fait (QUESTIONS.md Q-A6), à cocher dans Réglages
exemple_reponse: exemples/ror.json
moteur:
  adaptateur: ror
  parametres:
    correspondance_exacte: true  # A6 (spec 912) : en vérification, seul le nom exactement rendu compte
# A6 (spec 912) : ce registre de première main vérifie chaque nom trouvé (nom exact, puis contrôle A2 : un autre champ doit concorder).
verifie_sur: nom
