[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grappes"
version = "0.1.0"
description = "Intelligence de terrain : entités rangées en grappes"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "mcp==2.3.0"]

[project.scripts]
grappes = "grappes.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# mission autocalibration (D62) : truthdiscovery s'installe avec `--no-deps` (ses versions figées sont obsolètes ; voir docs/conception/calibration.md)
autocal = ["numpy", "scipy", "scikit-learn", "optuna", "pytrec_eval-terrier", "matplotlib", "bidict", "imageio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
